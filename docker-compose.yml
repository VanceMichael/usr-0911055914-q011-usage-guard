services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://guard:guard@db:5432/guard
      REDIS_URL: redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guard
      POSTGRES_PASSWORD: guard
      POSTGRES_DB: guard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guard -d guard"]
      interval: 5s
      timeout: 3s
      retries: 10
  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  loadtest:
    build: .
    profiles: ["loadtest"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      BASE_URL: http://api:8080
    command: ["node", "scripts/load-test.js"]
volumes:
  pgdata:
